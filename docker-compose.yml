services:
  redis:
    image: redis:alpine
    container_name: masterplan-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: .
    container_name: masterplan-backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: masterplan-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
