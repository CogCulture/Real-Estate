services:
  redis:
    image: redis:alpine
    container_name: masterplan-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./masterplan/backend
      dockerfile: Dockerfile
    container_name: masterplan-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - PORT=8001
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./masterplan/frontend
      dockerfile: Dockerfile.dev
    container_name: masterplan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8001
    depends_on:
      - backend
    restart: always
